<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Seamless damask-inspired tile -->
  <!-- Horizontal lines -->
  <line x1="0" y1="8" x2="40" y2="8" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="16" x2="40" y2="16" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="24" x2="40" y2="24" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="32" x2="40" y2="32" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <!-- Vertical lines -->
  <line x1="8" y1="0" x2="8" y2="40" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="16" y1="0" x2="16" y2="40" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="24" y1="0" x2="24" y2="40" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <line x1="32" y1="0" x2="32" y2="40" stroke="#B69D74" stroke-width="1" opacity="0.08"/>
  <!-- Decorative motifs at intersections -->
  <circle cx="8" cy="8" r="1.5" fill="#B69D74" opacity="0.1"/>
  <circle cx="8" cy="32" r="1.5" fill="#B69D74" opacity="0.1"/>
  <circle cx="32" cy="8" r="1.5" fill="#B69D74" opacity="0.1"/>
  <circle cx="32" cy="32" r="1.5" fill="#B69D74" opacity="0.1"/>
  <!-- Larger decorative elements -->
  <ellipse cx="20" cy="20" rx="6" ry="3" fill="#B69D74" opacity="0.05" transform="rotate(45 20 20)"/>
</svg>